; Talking Reader -- firmware
; Freenove ESP32-S3-WROOM CAM  (OV3660 camera, octal PSRAM, GPIO extension board)
;
; NOT the ESP32-WROVER the plan originally specified (D1). The team moved to an
; S3 board, which is a different architecture with a different pin map -- see
; D19 and hardware/wiring.md. Anything built as `esp32dev` was compiled for the
; wrong chip.

[env:freenove_s3]
platform  = espressif32@6.5.0    ; = Arduino-ESP32 core 2.0.14 (D9)
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; room for the PCM phrase bank

; FLASH MODE MUST BE DIO. The ROM boot log says `mode:DIO`; a qio_* build
; makes the 2nd-stage bootloader try to switch the flash to QIO, which fails
; on this part and hangs it BEFORE it prints anything. Symptom: esptool
; flashes and verifies fine, then total silence and no LED -- looks like a
; dead board. The tell is a ROM log that reaches `entry 0x...` and stops.
;
; Flash/PSRAM interface: DIO flash + OCTAL psram. This board is an N8R8 --
; 8 MB flash, 8 MB PSRAM -- both halves confirmed at runtime:
;   psramInit(): PSRAM enabled / ESP.getPsramSize() = 8386279
; The two halves fail differently and that made this slow to find:
;   wrong FLASH mode (qio) -> bootloader hangs before printing anything
;   wrong PSRAM mode (qspi) -> boots fine, but "PSRAM ID read error:
;                              0x00ffffff ... wrong PSRAM line mode"
; So a qio_opi build is silent and a dio_qspi build boots without PSRAM.
; Only dio_opi is correct. Change one half at a time if you ever revisit.
board_build.arduino.memory_type = dio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
; Serial over the S3's USB-Serial-JTAG peripheral, which is what this board's
; USB-C actually presents (VID:PID 303A:1001, serial = MAC -- verified with
; pyserial). core/esp32/HWCDC.h: `#if ARDUINO_USB_MODE / #if
; ARDUINO_USB_CDC_ON_BOOT / extern HWCDC Serial` -- so MODE=1 plus
; CDC_ON_BOOT=1 is the pair that binds `Serial` to that port. MODE=0 routes
; Serial to TinyUSB instead, which presents a DIFFERENT USB device; the
; descriptor then never changes from the ROM's and you get silence.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> UART0 -> the CH340 port

; NOTE: -mfix-esp32-psram-cache-issue is deliberately GONE. It is a workaround
; for a silicon erratum on the classic ESP32 only, and is not valid for the S3.

build_src_filter = +<*> -<smoke.cpp>

lib_deps =
    bblanchon/ArduinoJson@^7.0.4

; ---------------------------------------------------------------------------
; Minimal smoke test. Bisects "is the serial/boot config right?" from "does my
; firmware hang?" -- flash this and if it prints, the config is fine and the
; fault is in the application. Deliberately has NO -DBOARD_HAS_PSRAM, so it
; also tests whether PSRAM init is what kills the boot.
;   python -m platformio run -e smoke -t upload
; ---------------------------------------------------------------------------
[env:smoke]
platform  = espressif32@6.5.0
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = dio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> UART0 -> CH340 port
build_src_filter = -<*> +<smoke.cpp>
