; Talking Reader — firmware
; Freenove ESP32-WROVER CAM (OV2640, PSRAM, onboard USB-UART)

[env:freenove_wrover]
platform  = espressif32@6.5.0    ; = Arduino-ESP32 core 2.0.14
board     = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; room for the PCM phrase bank

; PSRAM is where the camera framebuffer lives. Without these the capture
; fails in a way that looks like a camera bug.
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
